/* Jump scare: full viewport, no buttons while visible */
#ghostScare{position:fixed;inset:0;z-index:9999;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden;pointer-events:auto}
#ghostScare.active{display:flex;animation:ghostShake .12s linear 0s 9 both}
#ghostScare img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.10);animation:ghostLunge 1.8s ease-out both}
#ghostScare:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 90px #000;pointer-events:none}
@keyframes ghostShake{0%{transform:translate(0,0)}25%{transform:translate(-7px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-5px)}100%{transform:translate(4px,5px)}}
@keyframes ghostLunge{0%{transform:scale(.92);filter:brightness(2.0) contrast(1.35)}18%{transform:scale(1.18);filter:brightness(1.3) contrast(1.3)}100%{transform:scale(1.3);filter:brightness(.55) contrast(1.2)}}
@media(prefers-reduced-motion:reduce){#ghostScare.active,#ghostScare img{animation:none}}

<script>
(()=>{'use strict';const N=20,cv=document.getElementById('board'),cx=cv.getContext('2d'),tile=20,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),msg=document.getElementById('message'),exp=document.getElementById('explain'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause'),soundBtn=document.getElementById('sound');let snake,dir,food,score=0,best=0,mode='ready',timer=null,nextTurn=null,sound=true,stepMs=200,ac=null,boost=false;try{best=+(localStorage.getItem('qsnake8_best')||0)}catch(e){}bestEl.textContent=best;cx.imageSmoothingEnabled=false;
function reset(){boost=false;document.getElementById('speed').classList.remove('pressed');snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=1;nextTurn=null;score=0;stepMs=200;scoreEl.textContent=0;foodPlace();draw()}
function foodPlace(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}
function beep(freq=440,duration=.07){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}catch(e){}}
let scareTimeout=null;
// Real recorded CC0 scream; requires an internet connection. If unavailable, use the synthesized fallback.
const screamAudio = new Audio('https://upload.wikimedia.org/wikipedia/commons/3/32/UncleSigmund_-_ahhh_%28cc0%29_%28freesound%29.mp3');
screamAudio.preload = 'auto';
screamAudio.volume = 0.85;
function scream(){
 if(!sound)return;
 try{
  screamAudio.pause();screamAudio.currentTime=0;
  const result=screamAudio.play();
  if(result&&typeof result.catch==='function')result.catch(()=>syntheticScream());
  return;
 }catch(e){syntheticScream()}
}
function syntheticScream(){
 if(!sound)return;
 try{
  ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,d=1.25;
  const master=ac.createGain();master.gain.setValueAtTime(.001,t);
  master.gain.linearRampToValueAtTime(.25,t+.045);master.gain.setValueAtTime(.25,t+.32);
  master.gain.exponentialRampToValueAtTime(.001,t+d);master.connect(ac.destination);
  // Layered pitch glide and formant-like harmonics create a synthetic scream.
  for(const [mult,level] of [[1,.65],[2,.26],[3,.18],[4,.09]]){
   const o=ac.createOscillator(),g=ac.createGain();o.type=mult===1?'sawtooth':'triangle';
   o.frequency.setValueAtTime(450*mult,t);o.frequency.exponentialRampToValueAtTime(850*mult,t+.18);
   o.frequency.exponentialRampToValueAtTime(620*mult,t+d);
   g.gain.value=level;o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
  }
  const size=Math.ceil(ac.sampleRate*d),buf=ac.createBuffer(1,size,ac.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<size;i++)data[i]=(Math.random()*2-1)*.45;
  const noise=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();
  noise.buffer=buf;f.type='bandpass';f.frequency.value=1700;f.Q.value=.65;ng.gain.value=.26;
  noise.connect(f);f.connect(ng);ng.connect(master);noise.start(t);noise.stop(t+d);
 }catch(e){}
}
function jumpScare(){
 const ghost=document.getElementById('ghostScare');
 if(scareTimeout!==null)clearTimeout(scareTimeout);
 ghost.classList.remove('active');void ghost.offsetWidth;
 ghost.classList.add('active');ghost.setAttribute('aria-hidden','false');
 scream();
 scareTimeout=setTimeout(()=>{ghost.classList.remove('active');ghost.setAttribute('aria-hidden','true');scareTimeout=null;show('GAME OVER',`ได้ <b>${score}</b> คะแนน<br>ลองทำคะแนนให้สูงขึ้นอีก!`,'↻ เล่นอีกครั้ง');},2000);
}
function tileRect(x,y,color,inset=1){cx.fillStyle=color;cx.fillRect(x*tile+inset,y*tile+inset,tile-inset*2,tile-inset*2)}
function draw(){cx.fillStyle='#07212a';cx.fillRect(0,0,400,400);for(let y=0;y<N;y++)for(let x=0;x<N;x++){cx.fillStyle=(x+y)%2?'#0b2832':'#0e2d37';cx.fillRect(x*tile,y*tile,tile,tile);cx.fillStyle='#123945';cx.fillRect(x*tile+1,y*tile+1,1,1)}if(food){let x=food.x,y=food.y;tileRect(x,y,'#861d35',1);tileRect(x,y,'#ff4662',3);cx.fillStyle='#ffb4bc';cx.fillRect(x*tile+5,y*tile+4,4,4);cx.fillStyle='#90e94d';cx.fillRect(x*tile+10,y*tile,6,5);cx.fillStyle='#326b35';cx.fillRect(x*tile+10,y*tile+3,2,4)}snake.forEach((p,i)=>{tileRect(p.x,p.y,i?'#367c26':'#285b19');tileRect(p.x,p.y,i?'#69d63c':'#a9f85d',3);cx.fillStyle='#caff88';cx.fillRect(p.x*tile+5,p.y*tile+4,7,4);if(!i){const x=p.x*tile,y=p.y*tile;cx.fillStyle='#0a1930';if(dir%2===0){cx.fillRect(x+5,y+(dir===0?4:12),3,3);cx.fillRect(x+13,y+(dir===0?4:12),3,3)}else{cx.fillRect(x+(dir===1?13:4),y+5,3,3);cx.fillRect(x+(dir===1?13:4),y+13,3,3)}}})}
function show(title,description,button){msg.textContent=title;exp.innerHTML=description;startBtn.textContent=button;overlay.classList.remove('hidden')}
function stopTimer(){if(timer!==null)clearTimeout(timer);timer=null}
function schedule(){stopTimer();if(mode==='playing')timer=setTimeout(tick,boost?Math.max(42,Math.round(stepMs/2)):stepMs)}
function tick(){if(mode!=='playing')return;if(nextTurn!==null){dir=(dir+nextTurn+4)%4;nextTurn=null}let head=snake[0],dx=[0,1,0,-1][dir],dy=[-1,0,1,0][dir],h={x:head.x+dx,y:head.y+dy};const eating=food&&h.x===food.x&&h.y===food.y;const body=eating?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){mode='over';stopTimer();setBoost(false);overlay.classList.add('hidden');draw();jumpScare();return}snake.unshift(h);if(eating){score+=10;scoreEl.textContent=score;beep(630,.06);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('qsnake8_best',String(best))}catch(e){}}stepMs=Math.max(88,200-Math.floor(score/50)*9);foodPlace();if(!food){mode='over';show('ชนะแล้ว!',`สุดยอด! คะแนน ${score}`,'เล่นใหม่');draw();return}}else snake.pop();draw();schedule()}
function start(){if(scareTimeout!==null)return;reset();mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';beep(480);schedule()}
function turn(sign){if(mode!=='playing')return;if(nextTurn===null){nextTurn=sign;beep(260,.025)}}
function pause(){if(mode==='playing'){setBoost(false);mode='paused';stopTimer();show('พักเกม','กดเล่นต่อเพื่อกลับเข้าเกม','▶ เล่นต่อ');pauseBtn.textContent='▶'}else if(mode==='paused'){resume()}}
function resume(){mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';schedule()}
function setBoost(on){if(boost===on)return;boost=on;document.getElementById('speed').classList.toggle('pressed',on);if(mode==='playing')schedule()}
function bindTurn(id,sign){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('pressed');turn(sign)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>b.classList.remove('pressed'));}
function bindSpeed(){const b=document.getElementById('speed');b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}setBoost(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>setBoost(false));}
startBtn.addEventListener('click',()=>mode==='paused'?resume():start());bindTurn('left',-1);bindTurn('right',1);bindSpeed();pauseBtn.addEventListener('click',pause);soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇'});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D','Shift'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')turn(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')turn(1);if(e.key==='Shift')setBoost(true);if(e.key===' '){if(mode==='ready'||mode==='over')start();else pause()}});document.addEventListener('keyup',e=>{if(e.key==='Shift')setBoost(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden){setBoost(false);if(mode==='playing')pause()}});reset();})();
</script></body></html>
