*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 55% 24%,#1c214a 0%,#0b1027 60%,#080d1f 100%);color:#eff2ff;font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif}body{padding:24px max(13px,env(safe-area-inset-right)) 30px max(13px,env(safe-area-inset-left));touch-action:pan-y}.app{max-width:560px;margin:auto}.brand{display:flex;align-items:center;gap:13px;margin-bottom:15px}.logo{height:65px;width:65px;border:3px solid #a861e9;border-radius:17px;box-shadow:0 0 12px #a861e956,inset 0 0 0 4px #1b1f42;display:grid;place-items:center;color:#76e83e;font-size:30px;font-weight:900}.brand strong{display:block;font-size:clamp(22px,6vw,29px);text-shadow:0 0 12px #a967fc;line-height:1.25}.brand strong span{color:#ffdb5c}.brand small{font-size:13px;color:#b7c0da;font-weight:750;letter-spacing:.6px}.stats{display:grid;grid-template-columns:1fr 1fr 48px 48px;gap:6px;margin-bottom:12px}.stat{display:flex;align-items:center;justify-content:space-between;border:2px solid #394a70;background:#1a2946;border-radius:14px;padding:9px 10px;min-width:0}.stat small{font-size:12px;color:#c7cee1}.stat b{font-size:23px;color:#ffdf65}.iconbtn{border:1px solid #647b9e;background:#253957;border-radius:12px;font-size:21px;color:white}.board-shell{position:relative;border:5px solid #b46cdd;border-radius:21px;padding:9px;background:#392356;box-shadow:0 7px 0 #341947,0 0 19px #b264e73d}.board-wrap{position:relative;background:#081327;border:3px solid #273958;border-radius:10px;overflow:hidden;aspect-ratio:1/1}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#071126c7;padding:12px}.overlay h2{color:#a2fc48;font-size:clamp(26px,7vw,35px);margin:0 0 8px;text-shadow:0 2px 2px #1b4b1b}.overlay p{margin:4px 0;color:#e8eaf9}.start{background:linear-gradient(#ffbc48,#f47917);border:0;color:#fff;font-size:21px;font-weight:800;padding:12px 26px;border-radius:16px;margin-top:16px;box-shadow:0 6px 0 #9d451a}.controls{display:grid;grid-template-columns:minmax(110px,1fr) minmax(210px,1.38fr);gap:clamp(12px,3vw,25px);align-items:center;margin-top:25px;padding:0 3px}.speedbox{display:flex;justify-content:center}.speed{width:min(100%,148px);height:128px;border-radius:22px;border:6px solid #a5f539;background:linear-gradient(140deg,#502975,#24153f);color:#fff0bb;font-weight:900;box-shadow:0 0 19px #a9ff4866,inset 0 0 0 4px #6b4090;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;text-shadow:1px 2px #2c1743;cursor:pointer}.speed .chev{font-size:50px;color:#b2ff4d;line-height:.9}.speed span:last-child{font-size:18px}.speed.active{background:linear-gradient(145deg,#517f13,#254017);border-color:#fffaa3;box-shadow:0 0 22px #b1ff72}.dpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,64px);gap:5px;justify-items:stretch;align-items:stretch}.arrow{border-radius:15px;border:3px solid #648cff;color:#fff;background:linear-gradient(#3b548b,#26345c);box-shadow:0 4px 0 #1b2b51,0 0 12px #6381ff80;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:900;touch-action:none;user-select:none;cursor:pointer}.arrow:active,.arrow.pressed{transform:translateY(3px);background:#526fac;box-shadow:0 1px 0 #1b2b51}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.hint{text-align:center;font-size:12px;line-height:1.65;color:#a7afcb;margin:20px auto 0;max-width:460px}.preview{font-size:11px;color:#9cabc8;text-align:center;margin-top:14px}@media(max-width:375px){.controls{grid-template-columns:minmax(95px,1fr) minmax(190px,1.6fr);gap:7px}.dpad{grid-template-rows:repeat(3,59px);gap:4px}.arrow{font-size:31px}.speed{height:115px}.speed span:last-child{font-size:16px}.stats{grid-template-columns:1fr 1fr 41px 41px}.stat{padding:7px 6px}.stat b{font-size:19px}.brand strong{font-size:23px}}@media(min-width:480px){.dpad{grid-template-rows:repeat(3,75px)}.speed{height:150px;width:170px}}
</style></head><body><main class="app"><header class="brand"><div class="logo">▦</div><div><strong>Q SNAKE <span>8-BIT</span></strong><small>CLASSIC PIXEL ARCADE</small></div></header><section class="stats"><div class="stat"><small>⭐ SCORE</small><b id="score">0</b></div><div class="stat"><small>🏆 BEST</small><b id="best">0</b></div><button class="iconbtn" id="pause" aria-label="พักเกม">⏸</button><button class="iconbtn" id="mute" aria-label="ปิดเสียง">🔊</button></section><section class="board-shell"><div class="board-wrap"><canvas id="game" width="400" height="400"></canvas><div id="overlay" class="overlay"><h2 id="message">Q SNAKE</h2><p id="sub">พร้อมเล่นหรือยัง?</p><button id="start" class="start">▶ เริ่มเล่น</button></div></div></section><section class="controls"><div class="speedbox"><button id="speed" class="speed" aria-pressed="false"><span class="chev">»</span><span>SPEED ×2</span></button></div><div class="dpad" aria-label="ปุ่มบังคับทิศทาง"><button class="arrow up" data-dir="up" aria-label="ขึ้น">▲</button><button class="arrow left" data-dir="left" aria-label="ซ้าย">◀</button><button class="arrow right" data-dir="right" aria-label="ขวา">▶</button><button class="arrow down" data-dir="down" aria-label="ลง">▼</button></div></section><p class="hint">ปุ่มทิศทางขนาดใหญ่ทางขวา • SPEED ×2 ทางซ้าย กดเพื่อเปิด/ปิดความเร็วสองเท่า • ไม่มีปุ่ม BOOST</p><p class="preview">HTML ตัวอย่างหน้าตาใหม่ — เล่นทดสอบปุ่มได้</p></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),sub=document.getElementById('sub'),startBtn=document.getElementById('start'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedBtn=document.getElementById('speed'),pauseBtn=document.getElementById('pause'),muteBtn=document.getElementById('mute');let snake,food,dir,nextDir,score=0,best=0,fast=false,playing=false,paused=false,muted=false,timer=null,audio=null;const grid=20,cell=20;try{best=Number(localStorage.getItem('qsnakePreviewBest')||0)}catch(e){}bestEl.textContent=best;function render(){ctx.fillStyle='#091629';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#102038';ctx.lineWidth=.5;for(let i=0;i<=400;i+=20){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke()}if(!snake)return;ctx.fillStyle='#fd4269';ctx.fillRect(food.x*cell+3,food.y*cell+3,14,14);snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#b3ff53':'#5fdc49';ctx.fillRect(p.x*cell+2,p.y*cell+2,16,16);ctx.fillStyle='#24562b';if(i===0)ctx.fillRect(p.x*cell+6,p.y*cell+6,3,3)})}function placeFood(){let p;do{p={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}function beep(){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=680;gain.gain.value=.025;osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.07)}catch(e){}}function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir='right';nextDir='right';score=0;scoreEl.textContent=0;placeFood();playing=true;paused=false;overlay.style.display='none';pauseBtn.textContent='⏸';schedule();render()}function schedule(){clearInterval(timer);timer=setInterval(tick,fast?82:165)}function end(){playing=false;clearInterval(timer);message.textContent='GAME OVER';sub.textContent='ได้ '+score+' คะแนน';startBtn.textContent='↻ เล่นอีกครั้ง';overlay.style.display='flex'}function tick(){if(!playing||paused)return;dir=nextDir;const head={...snake[0]};if(dir==='up')head.y--;if(dir==='down')head.y++;if(dir==='left')head.x--;if(dir==='right')head.x++;const eat=head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=grid||head.y<0||head.y>=grid||body.some(p=>p.x===head.x&&p.y===head.y)){end();return}snake.unshift(head);if(eat){score+=10;scoreEl.textContent=score;beep();if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('qsnakePreviewBest',best)}catch(e){}}placeFood()}else snake.pop();render()}const opposite={up:'down',down:'up',left:'right',right:'left'};function move(d){if(!playing||paused)return;if(d!==opposite[dir])nextDir=d}document.querySelectorAll('.arrow').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();move(btn.dataset.dir);btn.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','pointerleave'])btn.addEventListener(ev,()=>btn.classList.remove('pressed'));btn.addEventListener('click',()=>move(btn.dataset.dir))});window.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}});speedBtn.addEventListener('click',()=>{fast=!fast;speedBtn.classList.toggle('active',fast);speedBtn.setAttribute('aria-pressed',fast);if(playing)schedule()});pauseBtn.addEventListener('click',()=>{if(!playing)return;paused=!paused;pauseBtn.textContent=paused?'▶':'⏸';overlay.style.display=paused?'flex':'none';message.textContent='พักเกม';sub.textContent='กดปุ่มพักอีกครั้งเพื่อเล่นต่อ';startBtn.style.display=paused?'none':'block';if(!paused)render()});muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊'});startBtn.addEventListener('click',()=>{startBtn.style.display='block';reset()});snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:5,y:13};render()})();
