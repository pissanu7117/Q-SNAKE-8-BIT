<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101936"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Q SNAKE 8-BIT"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><title>Q SNAKE 8-BIT</title>
<style>:root{color-scheme:dark;--a:#a3ff51;--b:#a45dff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0,#26345e,#0b1026 74%);color:#f8faff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(100%,530px);padding:calc(env(safe-area-inset-top) + 14px) 13px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}.header{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:15px;border:2px solid #a45dff}.heading{flex:1}.heading h1{font-size:23px;line-height:1.1;margin:0;color:#fff;text-shadow:3px 3px #543194;letter-spacing:1px}.heading small{color:#c6d4ff;font-weight:700}.scores{display:flex;gap:9px}.score{flex:1;background:#192640;border:2px solid #41547f;padding:8px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.score span{color:#aec0e2;font-size:13px}.score strong{color:#ffe66b;font-size:21px;font-variant-numeric:tabular-nums}.frame{position:relative;padding:7px;background:#4d2c77;border:3px solid #c286ff;box-shadow:0 7px 0 #241438;border-radius:15px}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#071e27;image-rendering:pixelated;border:2px solid #0c6375;border-radius:4px}.overlay{position:absolute;inset:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;background:#091227de;border-radius:5px;padding:20px}.overlay.hidden{display:none}.overlay h2{font-size:26px;color:#a3ff51;margin:0;text-shadow:3px 3px #21512c}.overlay p{line-height:1.5;color:#e6ecff;margin:0}.btn{border:0;cursor:pointer;color:white;border-radius:14px;font-weight:900;touch-action:manipulation;user-select:none;-webkit-user-select:none}.start{background:linear-gradient(#ffba34,#ef741b);font-size:20px;padding:12px 30px;box-shadow:0 5px 0 #853915}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}.turn{min-height:84px;font-size:25px;background:linear-gradient(#6f4cbe,#452889);box-shadow:0 6px 0 #26134d;border:2px solid #b28cff;display:flex;align-items:center;justify-content:center;gap:8px}.turn:active,.start:active{transform:translateY(4px);box-shadow:0 1px 0 #26134d}.turn em{font-style:normal;font-size:34px}.secondary{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}.secondary button{background:#243351;border:1px solid #50628c;color:#eff4ff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}.tip{font-size:12px;color:#aebbd3;text-align:center;line-height:1.6;margin:0}@media(max-height:740px){.app{gap:7px;padding-top:8px}.icon{width:48px;height:48px}.heading h1{font-size:20px}.turn{min-height:65px}.score{padding:5px 10px}}@media(min-width:600px){.app{max-width:495px}}</style></head>
<body><main class="app"><header class="header"><img class="icon" src="icon.png" alt="Q Snake icon"><div class="heading"><h1>Q SNAKE <span style="color:#ffe05e">8-BIT</span></h1><small>CLASSIC PIXEL ARCADE</small></div></header><div class="scores"><div class="score"><span>⭐ คะแนน</span><strong id="score">0</strong></div><div class="score"><span>🏆 สูงสุด</span><strong id="best">0</strong></div></div><div class="frame"><canvas id="board" width="400" height="400" aria-label="สนามเกมงู"></canvas><div id="overlay" class="overlay"><h2 id="message">Q SNAKE 8-BIT</h2><p id="explain">งูเดินเองอัตโนมัติ<br>ใช้สองปุ่มเลี้ยวซ้ายและขวา<br>กินแอปเปิลให้ได้คะแนนมากที่สุด!</p><button id="start" class="btn start">▶ เริ่มเกม</button></div></div><div class="controls"><button class="btn turn" id="left" aria-label="เลี้ยวซ้าย"><em>↶</em> เลี้ยวซ้าย</button><button class="btn turn" id="right" aria-label="เลี้ยวขวา">เลี้ยวขวา <em>↷</em></button></div><div class="secondary"><button id="pause">⏸ หยุดชั่วคราว</button><button id="sound">🔊 เสียง: เปิด</button></div><p class="tip">กดซ้ายหรือขวาเพื่อหมุนตามทิศหัวงู • คีย์บอร์ดใช้ ← → หรือ A D<br>คะแนนสูงสุดเก็บไว้ในเครื่องนี้</p></main>
<script>
(()=>{'use strict';const N=20,cv=document.getElementById('board'),cx=cv.getContext('2d'),tile=20,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),msg=document.getElementById('message'),exp=document.getElementById('explain'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause'),soundBtn=document.getElementById('sound');let snake,dir,food,score=0,best=0,mode='ready',timer=null,nextTurn=null,sound=true,stepMs=200,ac=null;try{best=+(localStorage.getItem('qsnake8_best')||0)}catch(e){}bestEl.textContent=best;cx.imageSmoothingEnabled=false;
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=1;nextTurn=null;score=0;stepMs=200;scoreEl.textContent=0;foodPlace();draw()}
function foodPlace(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}
function beep(freq=440,duration=.07){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}catch(e){}}
function tileRect(x,y,color,inset=1){cx.fillStyle=color;cx.fillRect(x*tile+inset,y*tile+inset,tile-inset*2,tile-inset*2)}
function draw(){cx.fillStyle='#07212a';cx.fillRect(0,0,400,400);for(let y=0;y<N;y++)for(let x=0;x<N;x++){cx.fillStyle=(x+y)%2?'#0b2832':'#0e2d37';cx.fillRect(x*tile,y*tile,tile,tile);cx.fillStyle='#123945';cx.fillRect(x*tile+1,y*tile+1,1,1)}if(food){let x=food.x,y=food.y;tileRect(x,y,'#861d35',1);tileRect(x,y,'#ff4662',3);cx.fillStyle='#ffb4bc';cx.fillRect(x*tile+5,y*tile+4,4,4);cx.fillStyle='#90e94d';cx.fillRect(x*tile+10,y*tile,6,5);cx.fillStyle='#326b35';cx.fillRect(x*tile+10,y*tile+3,2,4)}snake.forEach((p,i)=>{tileRect(p.x,p.y,i?'#367c26':'#285b19');tileRect(p.x,p.y,i?'#69d63c':'#a9f85d',3);cx.fillStyle='#caff88';cx.fillRect(p.x*tile+5,p.y*tile+4,7,4);if(!i){const x=p.x*tile,y=p.y*tile;cx.fillStyle='#0a1930';if(dir%2===0){cx.fillRect(x+5,y+(dir===0?4:12),3,3);cx.fillRect(x+13,y+(dir===0?4:12),3,3)}else{cx.fillRect(x+(dir===1?13:4),y+5,3,3);cx.fillRect(x+(dir===1?13:4),y+13,3,3)}}})}
function show(title,description,button){msg.textContent=title;exp.innerHTML=description;startBtn.textContent=button;overlay.classList.remove('hidden')}
function stopTimer(){if(timer!==null)clearTimeout(timer);timer=null}
function schedule(){stopTimer();if(mode==='playing')timer=setTimeout(tick,stepMs)}
function tick(){if(mode!=='playing')return;if(nextTurn!==null){dir=(dir+nextTurn+4)%4;nextTurn=null}let head=snake[0],dx=[0,1,0,-1][dir],dy=[-1,0,1,0][dir],h={x:head.x+dx,y:head.y+dy};const eating=food&&h.x===food.x&&h.y===food.y;const body=eating?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){mode='over';stopTimer();beep(180,.2);show('GAME OVER',`ได้ <b>${score}</b> คะแนน<br>ลองทำคะแนนให้สูงขึ้นอีก!`,'↻ เล่นอีกครั้ง');draw();return}snake.unshift(h);if(eating){score+=10;scoreEl.textContent=score;beep(630,.06);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('qsnake8_best',String(best))}catch(e){}}stepMs=Math.max(88,200-Math.floor(score/50)*9);foodPlace();if(!food){mode='over';show('ชนะแล้ว!',`สุดยอด! คะแนน ${score}`,'เล่นใหม่');draw();return}}else snake.pop();draw();schedule()}
function start(){reset();mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸ หยุดชั่วคราว';beep(480);schedule()}
function turn(sign){if(mode!=='playing')return;if(nextTurn===null){nextTurn=sign;beep(260,.025)}}
function pause(){if(mode==='playing'){mode='paused';stopTimer();show('พักเกม','กดเล่นต่อเพื่อกลับเข้าเกม','▶ เล่นต่อ');pauseBtn.textContent='▶ เล่นต่อ'}else if(mode==='paused'){resume()}}
function resume(){mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸ หยุดชั่วคราว';schedule()}
startBtn.addEventListener('click',()=>mode==='paused'?resume():start());document.getElementById('left').addEventListener('click',()=>turn(-1));document.getElementById('right').addEventListener('click',()=>turn(1));pauseBtn.addEventListener('click',pause);soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด'});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')turn(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')turn(1);if(e.key===' '){if(mode==='ready'||mode==='over')start();else pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});reset();})();
</script></body></html>
