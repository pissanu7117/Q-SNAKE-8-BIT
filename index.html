<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101936"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Q SNAKE 8-BIT"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><title>Q SNAKE 8-BIT V3</title>
<style>:root{color-scheme:dark;--a:#a3ff51;--b:#a45dff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0,#26345e,#0b1026 74%);color:#f8faff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(100%,530px);padding:calc(env(safe-area-inset-top) + 14px) 13px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}.header{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:15px;border:2px solid #a45dff}.heading{flex:1}.heading h1{font-size:23px;line-height:1.1;margin:0;color:#fff;text-shadow:3px 3px #543194;letter-spacing:1px}.heading small{color:#c6d4ff;font-weight:700}.scores{display:flex;gap:9px}.score{flex:1;background:#192640;border:2px solid #41547f;padding:8px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.score span{color:#aec0e2;font-size:13px}.score strong{color:#ffe66b;font-size:21px;font-variant-numeric:tabular-nums}.frame{position:relative;padding:7px;background:#4d2c77;border:3px solid #c286ff;box-shadow:0 7px 0 #241438;border-radius:15px}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#071e27;image-rendering:pixelated;border:2px solid #0c6375;border-radius:4px}.overlay{position:absolute;inset:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;background:#091227de;border-radius:5px;padding:20px}.overlay.hidden{display:none}.overlay h2{font-size:26px;color:#a3ff51;margin:0;text-shadow:3px 3px #21512c}.overlay p{line-height:1.5;color:#e6ecff;margin:0}.btn{border:0;cursor:pointer;color:white;border-radius:14px;font-weight:900;touch-action:manipulation;user-select:none;-webkit-user-select:none}.start{background:linear-gradient(#ffba34,#ef741b);font-size:20px;padding:12px 30px;box-shadow:0 5px 0 #853915}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}.turn{min-height:84px;font-size:25px;background:linear-gradient(#6f4cbe,#452889);box-shadow:0 6px 0 #26134d;border:2px solid #b28cff;display:flex;align-items:center;justify-content:center;gap:8px}.turn:active,.start:active{transform:translateY(4px);box-shadow:0 1px 0 #26134d}.turn em{font-style:normal;font-size:34px}.secondary{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}.secondary button{background:#243351;border:1px solid #50628c;color:#eff4ff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}.tip{font-size:12px;color:#aebbd3;text-align:center;line-height:1.6;margin:0}@media(max-height:740px){.app{gap:7px;padding-top:8px}.icon{width:48px;height:48px}.heading h1{font-size:20px}.turn{min-height:65px}.score{padding:5px 10px}}@media(min-width:600px){.app{max-width:495px}}
/* Q SNAKE V3: responsive and immediate-touch 3-button layout */
.scores{align-items:stretch;gap:7px}.score{min-width:0;padding:7px 8px;gap:4px}.score span{font-size:11px}.score strong{font-size:18px}
.top-actions{display:flex;gap:6px;flex-shrink:0}.top-actions button{min-width:43px;height:45px;border:2px solid #6c7ca4;border-radius:12px;background:#243451;color:#fff;font-size:21px;touch-action:manipulation;cursor:pointer}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 3px 1px;grid-template-columns:none}
.control-wrap{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;gap:6px}
.control-wrap.boost-wrap{flex:.83}
.control-label{font-size:12px;color:#dce6ff;font-weight:800;letter-spacing:.1px;white-space:nowrap}
.turn,.boost{position:relative;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:filter .08s,transform .08s}
.turn{width:min(100%,112px);aspect-ratio:1;min-height:0;border-radius:50%;background:linear-gradient(155deg,#465c9b,#282965);border:4px solid #a5d4ff;box-shadow:0 6px 0 #101333, inset 0 0 0 5px #2c3b6a;font-size:0}
.turn.right-turn{background:linear-gradient(155deg,#317d69,#18523f);border-color:#8ef6a5;box-shadow:0 6px 0 #0b3026,inset 0 0 0 5px #23674f}
.turn svg{width:72%;height:72%;pointer-events:none;filter:drop-shadow(0 2px 0 #0f2143)}
.boost{width:min(100%,91px);aspect-ratio:1;min-height:0;border:none;border-radius:0;background:transparent;box-shadow:none}
.boost::before{content:'';position:absolute;inset:0;background:linear-gradient(150deg,#f9cb63,#dd7c1c);clip-path:polygon(25% 5%,75% 5%,98% 50%,75% 95%,25% 95%,2% 50%);filter:drop-shadow(0 4px 0 #8c481d)}
.boost::after{content:'';position:absolute;inset:7px;background:#69401f;clip-path:polygon(25% 5%,75% 5%,98% 50%,75% 95%,25% 95%,2% 50%)}
.boost svg{z-index:1;width:78%;height:70%;pointer-events:none;filter:drop-shadow(0 2px 1px #4b2a09)}
.turn.pressed,.boost.pressed{transform:translateY(3px) scale(.96);filter:brightness(1.28)}
.boost.active::before{background:linear-gradient(150deg,#fff48e,#ff9427)}
.tip{margin-top:2px}
@media(max-width:375px){.app{padding-left:9px;padding-right:9px}.header{gap:8px}.heading h1{font-size:20px}.score{padding:5px}.score span{font-size:10px}.score strong{font-size:16px}.top-actions button{min-width:37px;height:42px;font-size:19px}.controls{gap:5px}.turn{max-width:101px}.boost{max-width:81px}}
@media(max-height:720px){.app{gap:7px}.controls{margin-top:2px}.turn{max-width:90px}.boost{max-width:74px}.control-label{font-size:11px}}
</style></head>
<body><main class="app"><header class="header"><img class="icon" src="icon.png" alt="Q Snake icon"><div class="heading"><h1>Q SNAKE <span style="color:#ffe05e">8-BIT</span></h1><small>CLASSIC PIXEL ARCADE</small></div></header><div class="scores"><div class="score"><span>⭐ คะแนน</span><strong id="score">0</strong></div><div class="score"><span>🏆 สูงสุด</span><strong id="best">0</strong></div><div class="top-actions"><button id="pause" type="button" aria-label="หยุดชั่วคราว">⏸</button><button id="sound" type="button" aria-label="ปิดเสียง">🔊</button></div></div><div class="frame"><canvas id="board" width="400" height="400" aria-label="สนามเกมงู"></canvas><div id="overlay" class="overlay"><h2 id="message">Q SNAKE 8-BIT</h2><p id="explain">งูเดินเองอัตโนมัติ<br>ใช้สองปุ่มเลี้ยวซ้ายและขวา<br>กินแอปเปิลให้ได้คะแนนมากที่สุด!</p><button id="start" class="btn start">▶ เริ่มเกม</button></div></div><div class="controls">
<div class="control-wrap"><button class="btn turn" type="button" id="left" aria-label="เลี้ยวซ้าย" aria-keyshortcuts="ArrowLeft"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M71 77 A33 33 0 1 0 32 27" fill="none" stroke="#b5e4ff" stroke-width="12" stroke-linecap="round"/><path d="M16 26 L45 20 L33 50 Z" fill="#b5e4ff"/></svg></button><span class="control-label">เลี้ยวซ้าย</span></div>
<div class="control-wrap boost-wrap"><button class="btn boost" type="button" id="speed" aria-label="กดค้างเพื่อเร่งความเร็วสองเท่า"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M7 37 L22 50 L7 63" fill="none" stroke="#ffe4a2" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M28 30 L49 50 L28 70" fill="none" stroke="#ffe4a2" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M56 23 L85 50 L56 77" fill="none" stroke="#fff5b6" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/></svg></button><span class="control-label">SPEED ×2</span></div>
<div class="control-wrap"><button class="btn turn right-turn" type="button" id="right" aria-label="เลี้ยวขวา" aria-keyshortcuts="ArrowRight"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M29 77 A33 33 0 1 1 68 27" fill="none" stroke="#baffc1" stroke-width="12" stroke-linecap="round"/><path d="M84 26 L55 20 L67 50 Z" fill="#baffc1"/></svg></button><span class="control-label">เลี้ยวขวา</span></div>
</div><p class="tip">แตะซ้าย/ขวาเพื่อเลี้ยว • กดค้าง SPEED เพื่อเร่ง ×2 • แตะพร้อมกันได้<br>คะแนนสูงสุดเก็บไว้ในเครื่องนี้</p></main>
<script>
(()=>{'use strict';const N=20,cv=document.getElementById('board'),cx=cv.getContext('2d'),tile=20,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),msg=document.getElementById('message'),exp=document.getElementById('explain'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause'),soundBtn=document.getElementById('sound');let snake,dir,food,score=0,best=0,mode='ready',timer=null,turnQueue=[],sound=true,stepMs=200,boosting=false,ac=null;try{best=+(localStorage.getItem('qsnake8_best')||0)}catch(e){}bestEl.textContent=best;cx.imageSmoothingEnabled=false;
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=1;turnQueue=[];boosting=false;score=0;stepMs=200;scoreEl.textContent=0;foodPlace();draw()}
function foodPlace(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}
function beep(freq=440,duration=.07){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}catch(e){}}
function tileRect(x,y,color,inset=1){cx.fillStyle=color;cx.fillRect(x*tile+inset,y*tile+inset,tile-inset*2,tile-inset*2)}
function draw(){cx.fillStyle='#07212a';cx.fillRect(0,0,400,400);for(let y=0;y<N;y++)for(let x=0;x<N;x++){cx.fillStyle=(x+y)%2?'#0b2832':'#0e2d37';cx.fillRect(x*tile,y*tile,tile,tile);cx.fillStyle='#123945';cx.fillRect(x*tile+1,y*tile+1,1,1)}if(food){let x=food.x,y=food.y;tileRect(x,y,'#861d35',1);tileRect(x,y,'#ff4662',3);cx.fillStyle='#ffb4bc';cx.fillRect(x*tile+5,y*tile+4,4,4);cx.fillStyle='#90e94d';cx.fillRect(x*tile+10,y*tile,6,5);cx.fillStyle='#326b35';cx.fillRect(x*tile+10,y*tile+3,2,4)}snake.forEach((p,i)=>{tileRect(p.x,p.y,i?'#367c26':'#285b19');tileRect(p.x,p.y,i?'#69d63c':'#a9f85d',3);cx.fillStyle='#caff88';cx.fillRect(p.x*tile+5,p.y*tile+4,7,4);if(!i){const x=p.x*tile,y=p.y*tile;cx.fillStyle='#0a1930';if(dir%2===0){cx.fillRect(x+5,y+(dir===0?4:12),3,3);cx.fillRect(x+13,y+(dir===0?4:12),3,3)}else{cx.fillRect(x+(dir===1?13:4),y+5,3,3);cx.fillRect(x+(dir===1?13:4),y+13,3,3)}}})}
function show(title,description,button){msg.textContent=title;exp.innerHTML=description;startBtn.textContent=button;overlay.classList.remove('hidden')}
function stopTimer(){if(timer!==null)clearTimeout(timer);timer=null}
function schedule(){stopTimer();if(mode==='playing')timer=setTimeout(tick,Math.max(40,Math.round(stepMs/(boosting?2:1))))}
function tick(){if(mode!=='playing')return;if(turnQueue.length){dir=(dir+turnQueue.shift()+4)%4}let head=snake[0],dx=[0,1,0,-1][dir],dy=[-1,0,1,0][dir],h={x:head.x+dx,y:head.y+dy};const eating=food&&h.x===food.x&&h.y===food.y;const body=eating?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){mode='over';stopTimer();beep(180,.2);show('GAME OVER',`ได้ <b>${score}</b> คะแนน<br>ลองทำคะแนนให้สูงขึ้นอีก!`,'↻ เล่นอีกครั้ง');draw();return}snake.unshift(h);if(eating){score+=10;scoreEl.textContent=score;beep(630,.06);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('qsnake8_best',String(best))}catch(e){}}stepMs=Math.max(88,200-Math.floor(score/50)*9);foodPlace();if(!food){mode='over';show('ชนะแล้ว!',`สุดยอด! คะแนน ${score}`,'เล่นใหม่');draw();return}}else snake.pop();draw();schedule()}
function start(){reset();boost(false);mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';pauseBtn.setAttribute('aria-label','หยุดชั่วคราว');beep(480);schedule()}
function turn(sign){if(mode!=='playing')return;if(turnQueue.length<2){turnQueue.push(sign);beep(260,.025)}}
function pause(){if(mode==='playing'){boost(false);mode='paused';stopTimer();show('พักเกม','กดเล่นต่อเพื่อกลับเข้าเกม','▶ เล่นต่อ');pauseBtn.textContent='▶';pauseBtn.setAttribute('aria-label','เล่นต่อ')}else if(mode==='paused'){resume()}}
function resume(){mode='playing';overlay.classList.add('hidden');pauseBtn.textContent='⏸';pauseBtn.setAttribute('aria-label','หยุดชั่วคราว');schedule()}
startBtn.addEventListener('click',()=>mode==='paused'?resume():start());
// Pointerdown reacts at touch-down (instead of waiting for click at touch-up).
function bindTurn(id,sign){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();b.classList.add('pressed');turn(sign)});for(const type of ['pointerup','pointercancel','pointerleave'])b.addEventListener(type,()=>b.classList.remove('pressed'));b.addEventListener('click',e=>{if(e.detail===0)turn(sign)})}
bindTurn('left',-1);bindTurn('right',1);
const speedBtn=document.getElementById('speed');
function boost(on){if(boosting===on)return;boosting=on;speedBtn.classList.toggle('active',on);speedBtn.classList.toggle('pressed',on);if(mode==='playing')schedule()}
speedBtn.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{speedBtn.setPointerCapture(e.pointerId)}catch(_){}boost(true)});
for(const eventName of ['pointerup','pointercancel','lostpointercapture'])speedBtn.addEventListener(eventName,()=>boost(false));
window.addEventListener('blur',()=>boost(false));
pauseBtn.addEventListener('click',pause);soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇';soundBtn.setAttribute('aria-label',sound?'ปิดเสียง':'เปิดเสียง')});document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')turn(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')turn(1);if(e.key===' '){if(mode==='ready'||mode==='over')start();else pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden){boost(false);if(mode==='playing')pause()}});reset();})();
</script></body></html>
